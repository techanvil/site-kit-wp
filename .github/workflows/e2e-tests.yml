name: E2E Tests

on:
    workflow_dispatch:
        inputs:
            retry_full_test_name:
                description: 'Full test name (including describe names) to retry until failure (optional)'
                required: false
                type: string
            max_retries:
                description: 'Maximum number of retries (default: 1000)'
                required: false
                type: number
                default: 1000
            retry_until_failure:
                description: 'Keep running tests until failure'
                required: false
                type: boolean
                default: false
    push:
        branches:
            - develop
            - main
        # Ignore Storybook-only and unit-test-only changes when checking to run
        # E2E tests. This is useful when adding/modifying/refactoring/removing
        # test code ONLY in a commit, but saves running the expensive E2E test
        # suite on GitHub Actions when all that's changing are tests and not code
        # that would affect E2E behavior.
        paths:
            - '.github/workflows/e2e-tests.yml'
            - '.babelrc'
            - 'assets/**'
            - 'includes/**'
            - '/*.php'
            - 'jest-puppeteer.config.js'
            - 'composer.json'
            - 'composer.lock'
            - '/php-scoper/composer.lock'
            - 'package.json'
            - 'package-lock.json'
            - 'postcss.config.js'
            - 'webpack/*.config.js'
            - 'webpack.config.js'
            - 'tests/e2e/**'
            - '!assets/**/__tests__/**/*.js'
            - '!assets/**/test/*.js'
            - '!assets/**/*.test.js'
            - '!packages/**/__tests__/**/*.js'
            - '!packages/**/test/*.js'
            - '!packages/**/*.test.js'
    # pull_request:
    #     branches:
    #         - develop
    #         - main
    #         - 'feature/**'
    #     # Ignore Storybook-only and unit-test-only changes when checking to run
    #     # E2E tests. This is useful when adding/modifying/refactoring/removing
    #     # test code ONLY in a commit, but saves running the expensive E2E test
    #     # suite on GitHub Actions when all that's changing are tests and not code
    #     # that would affect E2E behavior.
    #     paths:
    #         - '.github/workflows/e2e-tests.yml'
    #         - '.babelrc'
    #         - 'assets/**'
    #         - 'includes/**'
    #         - '/*.php'
    #         - 'jest-puppeteer.config.js'
    #         - 'composer.json'
    #         - 'composer.lock'
    #         - '/php-scoper/composer.lock'
    #         - 'package.json'
    #         - 'package-lock.json'
    #         - 'postcss.config.js'
    #         - 'webpack/*.config.js'
    #         - 'webpack.config.js'
    #         - 'tests/e2e/**'
    #         - '!assets/**/__tests__/**/*.js'
    #         - '!assets/**/test/*.js'
    #         - '!assets/**/*.test.js'
    #         - '!packages/**/__tests__/**/*.js'
    #         - '!packages/**/test/*.js'
    #         - '!packages/**/*.test.js'
    #     types:
    #         - opened
    #         - reopened
    #         - synchronize
    #         - ready_for_review

concurrency:
    group: e2e-tests-${{ github.ref }}
    cancel-in-progress: true

jobs:
    e2e-tests:
        name: E2E (WordPress latest)
        runs-on: ubuntu-latest
        timeout-minutes: 60
        if: >
            github.event_name == 'workflow_dispatch' ||
            github.event_name == 'push'
        # || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
        env:
            AMP_VERSION: ''
            WP_VERSION: 'latest'
            CA_CERT_REFRESH: ''
            ATTEMPT: 1
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js (.nvmrc)
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            # TODO: Fix and restore global npm cache.
            # - name: Restore global npm cache
            #   uses: actions/cache@v4
            #   id: global-npm-cache
            #   with:
            #       path: /opt/hostedtoolcache/node/14.21.3/x64/lib/node_modules
            #       key: global-npm-${{ runner.os }}-7.24.2

            # nvm@7 is the minimum version required for npm workspace support.
            # This is needed to prevent js lint failures due to module resolution to the workspace packages.
            # This can be removed once our node base version comes with nvm@7 or greater.
            - name: Install npm Globally
              #   if: steps.global-npm-cache.outputs.cache-hit != 'true'
              run: npm run install-global-npm

            # - name: Save global npm cache
            #   if: steps.global-npm-cache.outputs.cache-hit != 'true'
            #   uses: actions/cache/save@v4
            #   with:
            #       path: /opt/hostedtoolcache/node/14.21.3/x64/lib/node_modules
            #       key: global-npm-${{ runner.os }}-7.24.2

            - name: Check npm configuration
              run: |
                  echo "npm prefix: $(npm config get prefix)"
                  echo "npm global prefix: $(npm config get globalprefix)"
                  echo "npm global dir: $(npm config get global-dir)"
                  echo "npm global bin: $(npm config get global-bin)"
                  echo "npm root -g: $(npm root -g)"

            # Using static cache keys since only test files change between runs for this exercise.
            # Dependencies and build output are deterministic and can be cached permanently.
            - name: Restore npm dependencies cache
              uses: actions/cache@v4
              id: npm-cache
              with:
                  path: |
                      ${{ github.workspace }}/node_modules
                      ~/.npm
                  key: deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

            - name: npm install
              if: steps.npm-cache.outputs.cache-hit != 'true'
              run: npm ci

            - name: Save npm dependencies cache
              if: steps.npm-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@v4
              with:
                  path: |
                      ${{ github.workspace }}/node_modules
                      ~/.npm
                  key: deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

            - name: Get assets last commit
              id: assets-commit
              run: echo "hash=$(git rev-list -1 HEAD -- ./assets)" >> "$GITHUB_OUTPUT"

            - name: Restore build cache
              uses: actions/cache@v4
              id: build-cache
              with:
                  path: dist
                  key: build-${{ runner.os }}-${{ steps.assets-commit.outputs.hash }}

            - name: Build
              if: steps.build-cache.outputs.cache-hit != 'true'
              run: npm run build:test

            - name: Save build cache
              if: steps.build-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@v4
              with:
                  path: dist
                  key: build-${{ runner.os }}-${{ steps.assets-commit.outputs.hash }}

            # E2E tests use a dedicated container, this is just for Composer.
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '7.4'
                  tools: composer:2.1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Get Composer Cache Directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            # TODO: Fix and restore composer cache.
            # - name: Restore composer cache
            #   uses: actions/cache@v4
            #   id: composer-cache-step
            #   with:
            #       path: |
            #           ${{ steps.composer-cache.outputs.dir }}
            #           vendor
            #           third-party
            #       key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

            - name: Composer Install
              #   if: steps.composer-cache-step.outputs.cache-hit != 'true'
              run: composer install --no-interaction --no-progress --no-dev

            # - name: Save composer cache
            #   if: steps.composer-cache-step.outputs.cache-hit != 'true'
            #   uses: actions/cache/save@v4
            #   with:
            #       path: |
            #           ${{ steps.composer-cache.outputs.dir }}
            #           vendor
            #           third-party
            #       key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

            - name: Start environment
              run: npm run env:start

            # Set a unique ID for test results that includes run ID, attempt number, and timestamp
            # Using $GITHUB_ENV makes this variable available to all subsequent steps automatically
            - name: Set test results ID
              id: set-test-results-id
              run: echo "TEST_RESULTS_ID=$(date -u +'%Y%m%d-%H%M%S')-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}" >> $GITHUB_ENV

            - name: Run the tests (retry mode)
              if: github.event.inputs.retry_until_failure == 'true'
              env:
                  RETRY_FULL_TEST_NAME: ${{ github.event.inputs.retry_full_test_name }}
              run: |
                  current_attempt="${ATTEMPT}"
                  while [ "${current_attempt}" -le "${{ github.event.inputs.max_retries || 1000 }}" ]; do
                      echo "Attempt ${current_attempt} of ${{ github.event.inputs.max_retries || 1000 }}"
                      if ! CURRENT_ATTEMPT="${current_attempt}" npm run test:e2e; then
                          # Check if the specific test failed
                          if node "${{ github.workspace }}/tests/e2e/check-test-result.js"; then
                              echo "Target test failed on attempt ${current_attempt}"
                              exit 1
                          fi
                          echo "Other tests failed, continuing..."
                      else
                          echo "All tests passed on attempt ${current_attempt}, continuing..."
                      fi
                      current_attempt=$(( current_attempt + 1 ))
                      npm run env:reset-site
                      sleep 1
                  done
                  echo "Reached maximum number of retries (${{ github.event.inputs.max_retries || 1000 }}) without test failure"
                  exit 0
              working-directory: tests/e2e

            - name: Run the tests (normal mode)
              if: github.event.inputs.retry_until_failure != 'true'
              run: npm run test:e2e
              working-directory: tests/e2e

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: e2e-debugging-run[${{ github.run_attempt }}]-wp[${{ env.WP_VERSION }}]-amp[${{ env.AMP_VERSION }}]
                  path: |
                      ~/.npm/_logs/
                      tests/e2e/screenshots/
                      e2e-test-results/
